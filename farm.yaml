packages:
  - source: ./system
    targets:
      - "~"
    fold:
      - ".hammerspoon"
      - ".zsh/completions"
    environments:
      - home
      - work

  - source: ./vim/.vimrc
    targets:
      - "~/.vimrc"
      - "~/.config/nvim/init.vim"
    environments:
      - home
      - work

  - source: ./home
    targets:
      - "~"
    environments:
      - home

  - source: ./vscode
    targets:
      - ~/Library/Application Support/Code/User
      - ~/Library/Application Support/Cursor/User
    environments:
      - home
      - work

ignore:
  - EmmyLua.spoon/annotations
